# ai-blog-unified-platform
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ai-quantitative-trading/shared/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 101.132.78.217;

    ssl_certificate /opt/ai-quantitative-trading/shared/letsencrypt/live/ai-quant-ip/fullchain.pem;
    ssl_certificate_key /opt/ai-quantitative-trading/shared/letsencrypt/live/ai-quant-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/blog/ {
        client_max_body_size 16k;
        limit_req zone=blog_comment_post burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/api/blog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location = /quant {
        return 301 /quant/;
    }

    location /quant/api/ {
        limit_req zone=platform_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /quant/docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /quant/openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    location /quant/ {
        root /opt/ai-quantitative-trading/www;
        try_files $uri $uri/ /quant/index.html;
    }

    location = /crossBorderTrend {
        return 301 /crossBorderTrend/;
    }

    location /crossBorderTrend/api/ {
        limit_req zone=platform_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location /crossBorderTrend/ {
        root /opt/crossborder-trend-report/www;
        try_files $uri $uri/ /crossBorderTrend/index.html;
    }

    location = /smartCockpit {
        return 301 /smartCockpit/;
    }

    location = /smartCockpit/api/chat/stream {
        limit_req zone=platform_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    location /smartCockpit/api/ {
        limit_req zone=platform_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location /smartCockpit/ {
        root /opt/enterprise-ai-cockpit/www;
        try_files $uri $uri/ /smartCockpit/index.html;
    }

    location /assets/ {
        root /opt/ai-blog/current/dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /opt/ai-blog/current/dist;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location = /index.html {
        root /opt/ai-blog/current/dist;
        add_header Cache-Control "no-cache";
    }
}
