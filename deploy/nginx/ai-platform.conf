# ai-blog-unified-platform
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ai-quantitative-trading/shared/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://caibinice.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.caibinice.com;

    ssl_certificate /opt/ai-quantitative-trading/shared/letsencrypt/live/caibinice.com/fullchain.pem;
    ssl_certificate_key /opt/ai-quantitative-trading/shared/letsencrypt/live/caibinice.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://caibinice.com$request_uri;
}

# Keep the short-lived IP certificate as the default TLS fallback so the
# existing maintenance URL remains valid while ICP filing is in progress.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 101.132.78.217 _;

    ssl_certificate /opt/ai-quantitative-trading/shared/letsencrypt/live/ai-quant-ip/fullchain.pem;
    ssl_certificate_key /opt/ai-quantitative-trading/shared/letsencrypt/live/ai-quant-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/ai-platform-routes.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caibinice.com;

    ssl_certificate /opt/ai-quantitative-trading/shared/letsencrypt/live/caibinice.com/fullchain.pem;
    ssl_certificate_key /opt/ai-quantitative-trading/shared/letsencrypt/live/caibinice.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/ai-platform-routes.conf;
}