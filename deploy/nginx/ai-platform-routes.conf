# Shared AI platform routes and security headers. Included by both the IP and domain TLS servers.
    # Security headers. nginx's add_header does NOT inherit into a location that
    # declares any add_header of its own, so every location below that sets its
    # own Cache-Control must repeat this block. Keep the two lists in sync.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/blog/ {
        client_max_body_size 16k;
        limit_req zone=blog_comment_post burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/api/blog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location = /quant {
        return 301 /quant/;
    }

    location /quant/api/ {
        limit_req zone=platform_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # API reference and machine-readable spec are internal only. Do not expose the
    # full endpoint surface (including admin/action routes) to anonymous callers.
    location /quant/docs {
        return 404;
    }

    location = /quant/openapi.json {
        return 404;
    }

    location /quant/ {
        root /opt/ai-quantitative-trading/www;
        try_files $uri $uri/ /quant/index.html;
    }

    location = /crossBorderTrend {
        return 301 /crossBorderTrend/;
    }

    location /crossBorderTrend/api/ {
        limit_req zone=platform_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location /crossBorderTrend/ {
        root /opt/crossborder-trend-report/www;
        try_files $uri $uri/ /crossBorderTrend/index.html;
    }

    location = /smartCockpit {
        return 301 /smartCockpit/;
    }

    location = /smartCockpit/api/chat/stream {
        limit_req zone=platform_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    location /smartCockpit/api/ {
        limit_req zone=platform_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location /smartCockpit/ {
        root /opt/enterprise-ai-cockpit/www;
        try_files $uri $uri/ /smartCockpit/index.html;
    }

    # Fingerprinted assets: immutable, cached for a year. Own add_header, so the
    # security headers above are repeated here to keep them on asset responses.
    location /assets/ {
        root /opt/ai-blog/current/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /en/ {
        root /opt/ai-blog/current/dist;
        try_files /en.html =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /ja/ {
        root /opt/ai-blog/current/dist;
        try_files /ja.html =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~ ^/(en|ja)/(.+)/$ {
        return 301 /$1/$2$is_args$args;
    }

    # All HTML (root, /articles, /en/articles/*, misc files) must revalidate so a
    # heuristically cached page never references hashed assets from a purged release.
    location / {
        root /opt/ai-blog/current/dist;
        try_files $uri.html $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        root /opt/ai-blog/current/dist;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
