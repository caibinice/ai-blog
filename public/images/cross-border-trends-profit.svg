<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 700; }
      .sub  { fill: #6b7180; }
      .val  { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 700; font-size: 11px; }
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="386" rx="14" fill="#f7f8fb" stroke="#e2e5ee"/>
  <text x="360" y="30" text-anchor="middle" class="sub" font-size="13" fill="#8a90a2">Profit waterfall: sell price minus every fee equals gross margin</text>

  <!-- baseline -->
  <line x1="55" y1="300" x2="690" y2="300" stroke="#e2e5ee" stroke-width="1"/>

  <!-- connectors (running level) -->
  <line x1="119" y1="90"    x2="141" y2="90"    stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="189" y1="174"   x2="211" y2="174"   stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="259" y1="180.3" x2="281" y2="180.3" stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="329" y1="205.5" x2="351" y2="205.5" stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="399" y1="226.5" x2="421" y2="226.5" stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="469" y1="232.8" x2="491" y2="232.8" stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="539" y1="243.3" x2="561" y2="243.3" stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="609" y1="268.5" x2="631" y2="268.5" stroke="#c3c8d6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- sell price -->
  <rect x="71" y="90" width="48" height="210" rx="3" fill="#eaeefe" stroke="#4f6ef7" stroke-width="1.5"/>
  <text x="95" y="84" text-anchor="middle" class="val" fill="#3a52c9">100</text>
  <text x="95" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">sell</text>

  <!-- buy cost -->
  <rect x="141" y="90" width="48" height="84" rx="3" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="165" y="84" text-anchor="middle" class="val" fill="#c0392f">-40</text>
  <text x="165" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">buy</text>

  <!-- FX -->
  <rect x="211" y="174" width="48" height="6.3" rx="2" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="235" y="170" text-anchor="middle" class="val" fill="#c0392f">-3</text>
  <text x="235" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">fx</text>

  <!-- shipping -->
  <rect x="281" y="180.3" width="48" height="25.2" rx="3" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="305" y="176" text-anchor="middle" class="val" fill="#c0392f">-12</text>
  <text x="305" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">ship</text>

  <!-- platform fee -->
  <rect x="351" y="205.5" width="48" height="21" rx="3" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="375" y="201" text-anchor="middle" class="val" fill="#c0392f">-10</text>
  <text x="375" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">platform</text>

  <!-- pay fee -->
  <rect x="421" y="226.5" width="48" height="6.3" rx="2" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="445" y="222" text-anchor="middle" class="val" fill="#c0392f">-3</text>
  <text x="445" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">pay</text>

  <!-- tax -->
  <rect x="491" y="232.8" width="48" height="10.5" rx="2" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="515" y="228" text-anchor="middle" class="val" fill="#c0392f">-5</text>
  <text x="515" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">tax</text>

  <!-- ad cost -->
  <rect x="561" y="243.3" width="48" height="25.2" rx="3" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="585" y="239" text-anchor="middle" class="val" fill="#c0392f">-12</text>
  <text x="585" y="316" text-anchor="middle" class="code" font-size="11" fill="#2b2f42">ad</text>

  <!-- gross margin -->
  <rect x="631" y="268.5" width="48" height="31.5" rx="3" fill="#f1faf4" stroke="#2fa36b" stroke-width="1.5"/>
  <text x="655" y="264" text-anchor="middle" class="val" fill="#1f7a4d">15</text>
  <text x="655" y="316" text-anchor="middle" class="code" font-size="11" fill="#1f7a4d">margin</text>

  <text x="360" y="348" text-anchor="middle" class="sub" font-size="11.5">example units, illustrative &#8212; not a measured result</text>
  <text x="360" y="368" text-anchor="middle" class="val" font-size="11" fill="#6b7180">margin = sell &#8722; buy &#8722; fx &#8722; ship &#8722; platform &#8722; pay &#8722; tax &#8722; ad</text>
</svg>
