<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa0b4"/>
    </marker>
    <style>
      .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .item { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 13px; }
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="428" rx="14" fill="#f7f8fb" stroke="#e2e5ee"/>

  <!-- top node -->
  <rect x="210" y="26" width="300" height="52" rx="10" fill="#ffffff" stroke="#4f6ef7" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" class="code" font-weight="700" font-size="15" fill="#2b2f42">cherry-pick -n</text>
  <text x="360" y="68" text-anchor="middle" class="code" font-size="12" fill="#6b7180">everything is staged — now decide</text>

  <!-- branches -->
  <path d="M300,78 C240,110 200,120 195,146" fill="none" stroke="#9aa0b4" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M420,78 C480,110 520,120 525,146" fill="none" stroke="#9aa0b4" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- keep box -->
  <rect x="40" y="150" width="310" height="240" rx="12" fill="#f1faf4" stroke="#2fa36b" stroke-width="1.5"/>
  <text x="60" y="182" class="code" font-weight="700" font-size="16" fill="#1f7a4d">&#10003; Into prod_main</text>
  <line x1="60" y1="196" x2="330" y2="196" stroke="#cdead9"/>
  <text x="60" y="228" class="item" fill="#2b2f42">log-platform/**</text>
  <text x="60" y="258" class="item" fill="#2b2f42">2 backend controllers</text>
  <text x="60" y="288" class="item" fill="#2b2f42">module config class</text>
  <text x="60" y="318" class="item" fill="#2b2f42">minimal POM wiring</text>
  <text x="60" y="360" class="item" font-size="12" fill="#6b7180">one function → one commit</text>

  <!-- exclude box -->
  <rect x="370" y="150" width="310" height="240" rx="12" fill="#fdf3f2" stroke="#e5534b" stroke-width="1.5"/>
  <text x="390" y="182" class="code" font-weight="700" font-size="16" fill="#b23b34">&#10007; Excluded</text>
  <line x1="390" y1="196" x2="660" y2="196" stroke="#f6d4d1"/>
  <text x="390" y="228" class="item" fill="#2b2f42">log-platform-starter module</text>
  <text x="390" y="258" class="item" fill="#2b2f42">factory device / order calls</text>
  <text x="390" y="288" class="item" fill="#2b2f42">ThreadPoolConfig &amp; extras</text>
  <text x="390" y="318" class="item" fill="#2b2f42">Vue pages &amp; SQL scripts</text>
  <text x="390" y="360" class="item" font-size="12" fill="#6b7180">factory-specific, stays behind</text>
</svg>
